name: Windows product

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - product/v2
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Test Python engine
        run: python -m pytest -q

      - name: Run QBX 2.0 benchmark
        run: python benchmarks/v2_benchmark.py

      - name: Build CLI executable
        run: pyinstaller --clean --onefile --name qbx-cli qbx_cli.py

      - name: Build GUI executable
        run: pyinstaller --clean --onefile --windowed --name QBX qbx_gui.py

      - name: Smoke test CLI
        run: |
          .\dist\qbx-cli.exe --version
          .\dist\qbx-cli.exe --help

      - name: Self-test GUI executable
        run: .\dist\QBX.exe --self-test

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc installer\qbx.iss

      - name: Package portable build and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist\QBX.exe,dist\qbx-cli.exe -DestinationPath artifacts\QBX-Portable-2.0.0.zip -Force
          Copy-Item installer_output\QBX-Setup-2.0.0.exe artifacts\
          Copy-Item benchmarks\results\v2_latest.json artifacts\
          $files = @(
            "artifacts\QBX-Portable-2.0.0.zip",
            "artifacts\QBX-Setup-2.0.0.exe",
            "dist\QBX.exe",
            "dist\qbx-cli.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          $lines | Set-Content -Encoding ascii artifacts\SHA256SUMS.txt
          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload Windows product
        uses: actions/upload-artifact@v4
        with:
          name: QBX-Windows-2.0.0
          path: |
            artifacts/QBX-Portable-2.0.0.zip
            artifacts/QBX-Setup-2.0.0.exe
            artifacts/SHA256SUMS.txt
            artifacts/v2_latest.json
          if-no-files-found: error
