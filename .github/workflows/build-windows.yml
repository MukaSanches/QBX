name: Windows product

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - product/v3
      - hotfix/v3.0.1-ui
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Test Python engine
        run: python -m pytest -q

      - name: Run QBX 3.0 product benchmark
        run: python benchmarks/v3_benchmark.py

      - name: Build CLI executable
        run: pyinstaller --clean --onefile --name qbx-cli qbx_cli.py

      - name: Build GUI executable
        run: pyinstaller --clean --onefile --windowed --name QBX qbx_gui.py

      - name: Smoke test CLI
        run: |
          .\dist\qbx-cli.exe --version
          .\dist\qbx-cli.exe --help
          .\dist\qbx-cli.exe repair --help

      - name: Self-test GUI executable
        run: .\dist\QBX.exe --self-test

      - name: Smoke-test real GUI startup
        run: .\dist\QBX.exe --ui-smoke-test

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc installer\qbx.iss

      - name: Package portable build and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item dist\QBX.exe portable\
          Copy-Item dist\qbx-cli.exe portable\
          Copy-Item README.md portable\
          Copy-Item LICENSE portable\
          Compress-Archive -Path portable\* -DestinationPath artifacts\QBX-Portable-3.0.1.zip -Force
          Copy-Item installer_output\QBX-Setup-3.0.1.exe artifacts\
          Copy-Item benchmarks\results\v3_latest.json artifacts\
          $files = @(
            "artifacts\QBX-Portable-3.0.1.zip",
            "artifacts\QBX-Setup-3.0.1.exe",
            "dist\QBX.exe",
            "dist\qbx-cli.exe",
            "artifacts\v3_latest.json"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          $lines | Set-Content -Encoding ascii artifacts\SHA256SUMS.txt
          Get-Content artifacts\SHA256SUMS.txt

      - name: Upload Windows product
        uses: actions/upload-artifact@v4
        with:
          name: QBX-Windows-3.0.1
          path: |
            artifacts/QBX-Portable-3.0.1.zip
            artifacts/QBX-Setup-3.0.1.exe
            artifacts/SHA256SUMS.txt
            artifacts/v3_latest.json
          if-no-files-found: error

      - name: Publish GitHub Release from main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3.0.1"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              artifacts\QBX-Portable-3.0.1.zip `
              artifacts\QBX-Setup-3.0.1.exe `
              artifacts\SHA256SUMS.txt `
              artifacts\v3_latest.json `
              --target $env:GITHUB_SHA `
              --title "QBX 3.0.1 — Windows GUI hotfix" `
              --notes "QBX 3.0.1 fixes the Windows GUI startup crash caused by an ambiguous Tcl/Tk font descriptor, adds an actual packaged-GUI startup smoke test, refines the classic toolbar UI, and preserves the AGRP + ARK V3 engine and recovery behavior."
          }
