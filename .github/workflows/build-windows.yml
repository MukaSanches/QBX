name: Produto Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ler versão do produto
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION inválida: $version"
          }
          "QBX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versão detectada: $version"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,dev]"

      - name: Testar motor Python
        run: python -m pytest -q

      - name: Executar benchmark QBX V3
        run: python benchmarks/v3_benchmark.py

      - name: Executar benchmark da ponte universal
        run: python benchmarks/v3_2_bridge_benchmark.py

      - name: Compilar executável de linha de comando
        run: pyinstaller --clean --onefile --name qbx-cli qbx_cli.py

      - name: Compilar aplicativo gráfico
        run: pyinstaller --clean --onefile --windowed --name QBX qbx_gui.py

      - name: Testar executável de linha de comando
        run: |
          .\dist\qbx-cli.exe --version
          .\dist\qbx-cli.exe --help
          .\dist\qbx-cli.exe repair --help
          .\dist\qbx-cli.exe create --help
          .\dist\qbx-cli.exe formats

      - name: Autoteste do aplicativo gráfico
        run: .\dist\QBX.exe --self-test

      - name: Teste real de abertura da interface
        run: .\dist\QBX.exe --ui-smoke-test

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Gerar instalador do Windows
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Compilador Inno Setup não encontrado em $iscc"
          }
          & $iscc "/DMyAppVersion=$env:QBX_VERSION" installer\qbx.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao gerar o instalador."
          }

      - name: Montar versão portátil e checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item dist\QBX.exe portable\
          Copy-Item dist\qbx-cli.exe portable\
          Copy-Item README.md portable\
          Copy-Item LICENSE portable\

          $portable = "artifacts\QBX-Portable-$env:QBX_VERSION.zip"
          $installerSource = "installer_output\QBX-Setup-$env:QBX_VERSION.exe"
          $installerArtifact = "artifacts\QBX-Setup-$env:QBX_VERSION.exe"

          Compress-Archive -Path portable\* -DestinationPath $portable -Force
          if (-not (Test-Path $installerSource)) {
            throw "Instalador esperado não encontrado: $installerSource"
          }
          Copy-Item $installerSource $installerArtifact
          Copy-Item benchmarks\results\v3_latest.json artifacts\
          Copy-Item benchmarks\results\v3_2_bridge.json artifacts\

          $files = @(
            $portable,
            $installerArtifact,
            "dist\QBX.exe",
            "dist\qbx-cli.exe",
            "artifacts\v3_latest.json",
            "artifacts\v3_2_bridge.json"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          $lines | Set-Content -Encoding ascii artifacts\SHA256SUMS.txt
          Get-Content artifacts\SHA256SUMS.txt

      - name: Publicar artefato do Windows
        uses: actions/upload-artifact@v4
        with:
          name: QBX-Windows-${{ steps.version.outputs.version }}
          path: |
            artifacts/QBX-Portable-${{ steps.version.outputs.version }}.zip
            artifacts/QBX-Setup-${{ steps.version.outputs.version }}.exe
            artifacts/SHA256SUMS.txt
            artifacts/v3_latest.json
            artifacts/v3_2_bridge.json
          if-no-files-found: error

      - name: Publicar GitHub Release quando a main estiver validada
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:QBX_VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "A release $tag já existe. O build foi validado, mas nenhuma release duplicada será criada."
            exit 0
          }

          $portable = "artifacts\QBX-Portable-$env:QBX_VERSION.zip"
          $installer = "artifacts\QBX-Setup-$env:QBX_VERSION.exe"
          $notes = "QBX $env:QBX_VERSION foi compilado e validado automaticamente. Testes do motor, benchmarks, executáveis, abertura da interface, instalador e checksums SHA-256 foram verificados. Consulte CHANGELOG.md e a pasta research/ para ver em português simples o que mudou."
          gh release create $tag $portable $installer artifacts\SHA256SUMS.txt artifacts\v3_latest.json artifacts\v3_2_bridge.json --target $env:GITHUB_SHA --title "QBX $env:QBX_VERSION — versão validada" --notes $notes
