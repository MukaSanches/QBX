<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390">
<rect width="980" height="390" fill="#0d1117"/>
<text x="32" y="42" fill="#f0f6fc" font-family="Segoe UI,Arial" font-size="24" font-weight="700">QBX 2.0 product benchmark — pack / unpack time</text>
<text x="32" y="70" fill="#8b949e" font-family="Segoe UI,Arial" font-size="14">GitHub Actions Windows • seconds • lower is better</text>

<text x="32" y="128" fill="#c9d1d9" font-family="Segoe UI,Arial" font-size="15">QBX balanced</text>
<rect x="210" y="104" width="418" height="20" rx="4" fill="#58a6ff"/>
<rect x="210" y="130" width="20" height="20" rx="4" fill="#79c0ff"/>
<text x="642" y="120" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">pack 1.584 s</text>
<text x="642" y="146" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">unpack 0.077 s</text>

<text x="32" y="198" fill="#c9d1d9" font-family="Segoe UI,Arial" font-size="15">QBX smallest</text>
<rect x="210" y="174" width="464" height="20" rx="4" fill="#a371f7"/>
<rect x="210" y="200" width="21" height="20" rx="4" fill="#bc8cff"/>
<text x="688" y="190" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">pack 1.758 s</text>
<text x="688" y="216" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">unpack 0.078 s</text>

<text x="32" y="268" fill="#c9d1d9" font-family="Segoe UI,Arial" font-size="15">QBX adaptive AGRP</text>
<rect x="210" y="244" width="720" height="20" rx="4" fill="#3fb950"/>
<rect x="210" y="270" width="18" height="20" rx="4" fill="#56d364"/>
<text x="740" y="260" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">pack 3.029 s</text>
<text x="740" y="286" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">unpack 0.076 s</text>

<text x="32" y="338" fill="#c9d1d9" font-family="Segoe UI,Arial" font-size="15">ZIP Deflate 9</text>
<rect x="210" y="314" width="24" height="20" rx="4" fill="#d29922"/>
<rect x="210" y="340" width="5" height="20" rx="4" fill="#e3b341"/>
<text x="250" y="330" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">pack 0.092 s</text>
<text x="250" y="356" fill="#c9d1d9" font-family="Consolas,monospace" font-size="13">unpack 0.016 s</text>

<text x="32" y="382" fill="#8b949e" font-family="Segoe UI,Arial" font-size="13">AGRP spends additional packing time measuring/planning representations; ZIP was faster on this corpus.</text>
</svg>