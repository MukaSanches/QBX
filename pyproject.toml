[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbx-archive"
version = "1.0.0.dev1"
description = "Experimental goal-driven adaptive archive format with classical and quantum planning research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "QBX contributors"}]
keywords = ["archive", "compression", "deduplication", "qubo", "quantum-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
quantum = ["qiskit>=1", "qiskit-aer>=0.14", "numpy>=1.26"]

[project.scripts]
qbx = "qbx_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
