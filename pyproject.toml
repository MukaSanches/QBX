[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qbx-archive"
version = "3.0.1"
description = "QBX 3.0 resilient archive engine with AGRP global planning and ARK repair lattice"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "QBX contributors"}]
dependencies = [
  "zstandard>=0.23",
]
keywords = [
  "archive",
  "compression",
  "deduplication",
  "content-defined-chunking",
  "resilience",
  "repair-lattice",
  "qubo",
  "quantum-computing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
quantum = ["qiskit>=1", "qiskit-aer>=0.14", "numpy>=1.26", "scipy>=1.12"]
build = ["pyinstaller>=6.10", "build>=1.2"]

[project.scripts]
qbx = "qbx_cli:main"

[tool.setuptools]
py-modules = ["qbx_cli"]

[tool.setuptools.packages.find]
include = ["qbx", "qbx.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
